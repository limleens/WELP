name: WELP tests
on:
  push:
  pull_request:
jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check engine.mjs
          node --check hiit.mjs
      - name: Run workout engine tests
        run: node --test tests/*.test.mjs
