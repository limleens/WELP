name: Hanpi CI
on:
  push:
    branches:
      - feat/hanpi-desktop-mvp
    paths:
      - "hanpi/**"
      - ".github/workflows/hanpi-ci.yml"
  pull_request:
    paths:
      - "hanpi/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: hanpi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Unit tests
        working-directory: hanpi
        run: python -m pytest -q
      - name: UI initialization smoke test
        working-directory: hanpi
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import app
          ui = app.build_app()
          print("Hanpi Gradio UI initialized:", len(ui.fns), "events")
          PY
